# The credentials below are for local development only; they are not secrets.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoices
      POSTGRES_PASSWORD: invoices
      POSTGRES_DB: invoices
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoices -d invoices"]
      interval: 2s
      timeout: 3s
      retries: 20

  # HTTP + background loops (outbox relay, result consumer and, for the demo, the fake provider).
  api:
    build: .
    environment:
      DATABASE_URL: postgres://invoices:invoices@postgres:5432/invoices
      PORT: "3000"
      WORKERS_ENABLED: "true"
      SIMULATE_PROVIDER: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
